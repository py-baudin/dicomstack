[metadata]
name = dicomstack
description = A pydicom wrapper for simple loading and handling of DICOM stacks
version = 1.4.14

[options]
python_requires = >=3.10
install_requires =
    numpy
    pydicom>=3,<4
packages = dicomstack

[options.package_data]
dicomstack = py.typed

[options.extras_require]
pandas = pandas
test = pytest

[options.entry_points]
console_scripts =
    dicomstack = dicomstack.cli:cli